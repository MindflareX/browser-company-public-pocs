<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;font:20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2ff;color:#182033}
    #prompt,#fullscreen{height:100vh} #prompt{display:grid;place-items:center;padding:24px}
    button{width:min(720px,90vw);min-height:300px;border:3px solid #2846db;border-radius:24px;background:white;color:#182033;padding:32px;font:inherit;box-shadow:0 18px 50px rgba(30,44,82,.18);cursor:pointer}
    b,small{display:block;margin:16px} b{font-size:clamp(28px,5vw,48px)} small{line-height:1.5;color:#4b556b}
    #fullscreen{display:none;background:#f3f5f8}.bar{height:76px;padding:13px;background:#20242b;display:flex;align-items:center}.url{width:100%;background:#fff;border-radius:24px;padding:11px 20px;color:#1b2436}
    main{width:min(620px,calc(100% - 32px));margin:12vh auto;background:#fff;border-radius:18px;padding:34px;box-shadow:0 18px 60px rgba(20,30,55,.16)}
    html:fullscreen #prompt{display:none} html:fullscreen #fullscreen{display:block}
  </style>
</head>
<body>
  <div id="prompt"><button id="enter"><b>Enter fullscreen demonstration</b><small id="origin"></small><small>One click. No credentials or data are requested or collected.</small></button></div>
  <div id="fullscreen"><div class="bar"><div class="url">🔒 https://accounts.example/security</div></div><main><h1>Security verification</h1><p>All visible content below the native warning is attacker-controlled.</p><p>No form fields, credential collection, network callbacks, or analytics are present.</p><code id="result">Fullscreen request pending</code></main></div>
  <script>
    const originNode = document.querySelector('#origin');
    const enterButton = document.querySelector('#enter');
    const resultNode = document.querySelector('#result');
    originNode.textContent = 'requester self.origin = ' + self.origin;
    enterButton.onclick = async () => {
      try {
        await document.documentElement.requestFullscreen({navigationUI:'hide'});
        resultNode.textContent = 'requestFullscreen resolved';
      } catch (error) {
        enterButton.innerHTML = '<b>Fullscreen rejected</b><small>' + error.name + ': ' + error.message + '</small>';
      }
    };
  </script>
</body>
</html>
